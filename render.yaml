# ==============================================================================
# Render Blueprint Configuration (render.yaml)
# ==============================================================================
databases:
  - name: highfashion-db
    databaseName: medusa
    user: medusa
    plan: free

services:
  # ----------------------------------------------------------------------------
  # Medusa v2 Backend
  # ----------------------------------------------------------------------------
  - type: web
    name: highfashion-backend
    runtime: image
    image:
      url: docker.io/steel777/highfashion-backend:latest
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 9000
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=384"
      - key: DATABASE_URL
        fromDatabase:
          name: highfashion-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: STORE_CORS
        value: https://highfashion-storefront.onrender.com
      - key: ADMIN_CORS
        value: https://highfashion-backend.onrender.com
      - key: AUTH_CORS
        value: https://highfashion-storefront.onrender.com,https://highfashion-backend.onrender.com
      - key: SELF_PING_URL
        value: https://highfashion-backend.onrender.com/health

  # ----------------------------------------------------------------------------
  # Next.js Storefront
  # ----------------------------------------------------------------------------
  - type: web
    name: highfashion-storefront
    runtime: image
    image:
      url: docker.io/steel777/highfashion-storefront:latest
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8000
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=384"
      - key: NEXT_PUBLIC_DEFAULT_REGION
        value: in
      - key: NEXT_PUBLIC_MEDUSA_BACKEND_URL
        value: https://highfashion-backend.onrender.com
      - key: MEDUSA_BACKEND_URL
        value: https://highfashion-backend.onrender.com
      - key: NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY
        value: pk_a1b1a57e199157b891153b25fe6a027815989c7a87fdd5cc874612e8d6723a0c
      - key: SELF_PING_URL
        value: https://highfashion-storefront.onrender.com

