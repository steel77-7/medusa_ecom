name: Keep-Alive Ping

on:
  schedule:
    # Runs every 10 minutes (UTC)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Hosted Endpoints
        run: |
          echo "Pinging Storefront..."
          curl -sI -m 15 "${{ secrets.STOREFRONT_URL || 'https://your-storefront.onrender.com' }}" || true

          echo "Pinging Backend Health..."
          curl -sI -m 15 "${{ secrets.BACKEND_URL || 'https://your-backend.onrender.com/health' }}" || true

